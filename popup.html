<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>better-board</title>
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 14px;
        font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1f2328;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 2px;
      }
      .brand img {
        width: 20px;
        height: 20px;
      }
      h1 {
        margin: 0;
        font-size: 14px;
      }
      p {
        margin: 0 0 12px;
        color: #59636e;
        font-size: 12px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      label + label {
        margin-top: 10px;
      }
      /* Hiding GitHub's controls only means anything while the extension is
         running, so it reads as a child of the switch above it. */
      .dependent {
        margin-left: 22px;
      }
      .dependent.off {
        color: #8c959f;
        cursor: not-allowed;
      }
      .hint {
        margin: 3px 0 0 44px;
        color: #59636e;
        font-size: 11px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="icon.svg" alt="" />
      <h1>better-board</h1>
    </div>
    <p>Team and column filters on GitHub Projects boards.</p>
    <label>
      <input type="checkbox" id="enabled" />
      <span>Enabled</span>
    </label>
    <label class="dependent" id="hide-controls-label">
      <input type="checkbox" id="hide-controls" />
      <span>Hide default filter controls</span>
    </label>
    <p class="hint">Hides GitHub's own search, assignee and view controls on board views.</p>
    <script src="popup.js"></script>
  </body>
</html>
